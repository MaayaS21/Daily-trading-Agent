name: Thrice-Daily Multi-Asset Trading Briefing

on:
  schedule:
    # 1. 8:00 AM IST (2:30 AM UTC) -> Asian/Indian Premarket
    - cron: '30 2 * * *'
    
    # 2. 1 Hour Before London Open (6:00 AM UTC in Summer / 11:30 AM IST)
    - cron: '0 6 * * *'
    
    # 3. 1 Hour Before NY Open (12:30 PM UTC in Summer / 6:00 PM IST)
    - cron: '30 12 * * *'

  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow publishing the report back into the repo (for Ploutous)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for WeasyPrint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential python3-dev python3-pip libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install google-genai weasyprint requests

      - name: Determine Session Type and Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq "02" ]; then
            export SESSION_TYPE="PREMARKET"
          elif [ "$HOUR" -eq "06" ] || [ "$HOUR" -eq "07" ]; then
            export SESSION_TYPE="LONDON"
          else
            export SESSION_TYPE="NEWYORK"
          fi
          echo "SESSION_TYPE=$SESSION_TYPE" >> "$GITHUB_ENV"
          python generate_report.py

      # Publish the generated PDF into the repo so Ploutous can fetch the latest
      # brief (raw.githubusercontent.com). Additive — does not affect Telegram/email.
      - name: Publish report to repo
        if: success()
        run: |
          mkdir -p reports
          cp -f daily_trading_blueprint.pdf "reports/${SESSION_TYPE}.pdf" || { echo "no pdf produced"; exit 0; }
          python - <<'PY'
          import json, os, datetime
          idx = "reports/index.json"
          titles = {"PREMARKET": "Indian premarket", "LONDON": "London pre-open", "NEWYORK": "New York pre-open"}
          st = os.environ["SESSION_TYPE"]
          data = {"sessions": {}}
          if os.path.exists(idx):
              try:
                  data = json.load(open(idx))
              except Exception:
                  data = {"sessions": {}}
          data.setdefault("sessions", {})[st] = {
              "title": titles.get(st, st),
              "updated": datetime.datetime.utcnow().isoformat() + "Z",
              "file": f"{st}.pdf",
          }
          json.dump(data, open(idx, "w"), indent=2)
          print("index.json updated for", st)
          PY
          git config user.name "daily-agent"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git commit -m "report: ${SESSION_TYPE} $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || echo "push failed"
